name: publish

# Publishes to npm on a v* tag, authenticating with the NPM_TOKEN repo secret.
#
# NPM_TOKEN must be a granular access token with "Bypass two-factor
# authentication" enabled — the account enforces 2FA for writes, and without
# that flag npm rejects the publish. `setup-node`'s registry-url writes an
# .npmrc pointing at NODE_AUTH_TOKEN, so the publish step must export it or npm
# authenticates as anonymous and the registry answers 404 (not 403) for a
# package you cannot see.
#
# Release flow:
#   1. bump the version in package.json, commit, push to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag must match package.json's version — the guard below fails the run
# otherwise, so a mistagged release never reaches npm.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Fail fast and legibly. Without this, a missing/misnamed secret only
      # surfaces after the full build+test run, as a 404 that reads like the
      # package does not exist.
      - name: Verify the NPM_TOKEN secret is present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The NPM_TOKEN repo secret is empty or missing." >&2
            echo "Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # `npm publish` runs prepublishOnly (build + full test suite) first, so a
      # broken commit cannot be published even if the tag was pushed.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
